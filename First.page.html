<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season4Fashion</title>
    <link rel="stylesheet" href="style.css">
</head>
      <style>
        body {
          display:flex;
          height:100vh;
          margin:0;
          align-items:center
          ;justify-content:center;
          font-family:cursive;
          background-image: url(images/il-all.jpg);
        }


        .card{
          background:#fff;
          padding:24px;
          border-radius:8px;
          border:1px solid #ddd;
          text-align:center;
          box-shadow:0 4px 10px rgba(0,0,0,0.05)
        }


        h1{
          font-size:28px;
          margin:0 0 12px
        }
        p{
          margin:0 0 16px;
          color:#333
        }
        button{
          padding:10px 16px;
          font-size:16px;
          cursor:pointer;
          border-radius:6px;
          border:1px solid #3b82f6;
          background:#3b82f6;
          color:#fff}
         
        button:active{transform:translateY(1px)}
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Welcome To Our Seasonal Accessory Business StoreFront</h1>
        <p>Click the button below to enter the site.</p>
        <button id="enterBtn">Enter Website</button>
      </div>
      <script>
        document.getElementById('enterBtn').addEventListener('click', function(){
          window.location.href = 'verdant.valley.html';
        });
      </script>
    </body>
    </html>

    #cart {
    position: fixed;
    right: 30px;
    bottom: 30px;
    width: 65px;
    height: 65px;
    background-color: #D8C3A5;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    cursor: grab;
    z-index: 1000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    user-select: none;
}

#cart:active {
    cursor: grabbing;
}

#cartCount {
    position: absolute;
    top: -5px;
    right: -5px;
    background-color: red;
    color: white;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
}


#cartPanel {
    position: fixed;

    right: 20px;
    top: 20px;

    width: 300px;
    height: 500px;

    background-color: #FFF8E7;

    border-radius: 15px;

    box-shadow: 0 5px 20px rgba(0,0,0,0.3);

    z-index: 999;

    padding: 20px;

    display: none;
}


#cartHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
}


#closeCart {
    border: none;
    background: none;

    font-size: 20px;

    cursor: pointer;
}


#cartItems {
    height: 350px;

    overflow-y: auto;

    margin-top: 10px;
}


.cartItem {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 10px;

    margin-bottom: 8px;

    background-color: #D8C3A5;

    border-radius: 8px;
}


.removeItem {
    border: none;

    background-color: #AA5115;
    color: white;

    border-radius: 5px;

    cursor: pointer;
}


#cartTotal {
    font-size: 18px;
    font-weight: bold;

    margin-top: 10px;
}


#finishButton {

    margin-top: 10px;

    border: none;

    border-radius: 8px;

    background-color: #A8B89A;

    cursor: pointer;

    font-size: 16px;
}

<script>
const products = document.querySelectorAll(".item");

let selectedSeason = "All-year";


function applyFilters() {

    
    const selectedGenders = Array.from(
        document.querySelectorAll('input[data-group="gender"]:checked')
    ).map(function(checkbox) {
        return checkbox.value;
    });


   
    const selectedColors = Array.from(
        document.querySelectorAll('input[data-group="color"]:checked')
    ).map(function(checkbox) {
        return checkbox.value;
    });


    
    const selectedStyles = Array.from(
        document.querySelectorAll('input[data-group="style"]:checked')
    ).map(function(checkbox) {
        return checkbox.value;
    });


  
    const selectedEvents = Array.from(
        document.querySelectorAll('input[data-group="event"]:checked')
    ).map(function(checkbox) {
        return checkbox.value;
    });


    
    const selectedAccessories = Array.from(
        document.querySelectorAll('input[data-group="Atype"]:checked')
    ).map(function(checkbox) {
        return checkbox.value;
    });


    
    products.forEach(function(product) {

        const productSeason = product.dataset.season;
        const productGender = product.dataset.gender;
        const productColor = product.dataset.color;
        const productStyle = product.dataset.style;
        const productEvent = product.dataset.event;
        const productAccessory = product.dataset.atype;


        
        const matchesSeason =
            selectedSeason === "All-year" ||
            productSeason === selectedSeason;


        const matchesGender =
            selectedGenders.length === 0 ||
            selectedGenders.includes(productGender);


        const matchesColor =
            selectedColors.length === 0 ||
            selectedColors.includes(productColor);


        const matchesStyle =
            selectedStyles.length === 0 ||
            selectedStyles.includes(productStyle);


        const matchesEvent =
            selectedEvents.length === 0 ||
            selectedEvents.includes(productEvent);


        const matchesAccessory =
            selectedAccessories.length === 0 ||
            selectedAccessories.includes(productAccessory);


        
        if (
            matchesSeason &&
            matchesGender &&
            matchesColor &&
            matchesStyle &&
            matchesEvent &&
            matchesAccessory
        ) {
            product.style.display = "block";
        }
        else {
            product.style.display = "none";
        }

    });

}

const allFilters = document.querySelectorAll(".filter");

allFilters.forEach(function(filter) {

    filter.addEventListener("change", function() {
        applyFilters();
    });

});

let cartItems = [];

const cart = document.getElementById("cart");
const cartCount = document.getElementById("cartCount");
const cartPanel = document.getElementById("cartPanel");
const cartItemsContainer = document.getElementById("cartItems");
const cartTotal = document.getElementById("cartTotal");



products.forEach(function(product) {

    product.addEventListener("click", function() {

        const name = product.querySelector(".descrip p").textContent;

        const priceText = product.querySelector(".descrip p:last-child").textContent;

        const price = parseFloat(priceText.replace("$", ""));

        cartItems.push({
            name: name,
            price: price
        });

        updateCart();

    });

});



function updateCart() {

    cartItemsContainer.innerHTML = "";

    let total = 0;

    cartItems.forEach(function(item, index) {

        total += item.price;

        const cartItem = document.createElement("div");

        cartItem.className = "cartItem";

        cartItem.innerHTML = `
            <span>${item.name} - $${item.price.toFixed(2)}</span>
            <button class="removeItem" data-index="${index}">X</button>
        `;

        cartItemsContainer.appendChild(cartItem);

    });


    cartCount.textContent = cartItems.length;

    cartTotal.textContent = "Total: $" + total.toFixed(2);


   
    const removeButtons = document.querySelectorAll(".removeItem");

    removeButtons.forEach(function(button) {

        button.addEventListener("click", function(event) {

            event.stopPropagation();

            const index = Number(button.dataset.index);

            cartItems.splice(index, 1);

            updateCart();

        });

    });

}



cart.addEventListener("click", function() {

});

let isDragging = false;
let offsetX;
let offsetY;

cart.addEventListener("mousedown", function(event) {

    isDragging = true;

    offsetX = event.clientX - cart.getBoundingClientRect().left;
    offsetY = event.clientY - cart.getBoundingClientRect().top;

});

document.addEventListener("mousemove", function(event) {

    if (!isDragging) {
        return;
    }

    cart.style.left = (event.clientX - offsetX) + "px";
    cart.style.top = (event.clientY - offsetY) + "px";

    cart.style.right = "auto";
    cart.style.bottom = "auto";

});

document.addEventListener("mouseup", function() {

    isDragging = false;

});

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season4Fashion</title>
</head>
<style>
    body{
        display: flex;
        flex-direction: column;
        background-color: #ffffff;

    }
    .header {
        height: 70px;
        background-color: #C3DFe3;
        border: 1px solid #000000;

        display: flex;  
        align-items: center;
        justify-content: center;

        font-size: 14px;
        margin: 0;



    }
    .topsection{
        display: grid;
         grid-template-columns: 200px 1fr ;
         gap: 20px;
         width:100%;

    }

    .content{
        border: 2px solid #d47024;
        width: 200px;
        
    }

    .sidebar {
        background-color: #C3DFe3;
        height:300px;
        border: 1px solid #000000;
    }

    .filterbar {
        background-color: #C3DFe3;  
        height: 400px;
        
    } 

     .button {
        width: 82px;
        height: 30px;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        
        gap: 5px;
    }

     .checkboxes{
        display: flex;
        flex-direction: column;

    }

     .imageandlogo{
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid yellow;
        height: 200px;
        
        
    }

    .rightside{
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .main-content{
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid green;
        height: 500px;
    }


    .filter-content{
        display: flex;
        flex-direction: column;

    }
</style>
<body>
    <div class="header">Info Bar</div>
    <br>
<div class="topsection">

    <!-- LEFT SIDE -->
    <div class="content">

        <div class="sidebar">
            Side Bar

            <h3 style="font-size: 10px;">
                <i>Sort by</i>
            </h3>

            <div class="button">
                <button>Lowest Price</button>
                <button>Highest Price</button>
                <button>Popularity</button>
                <button>Z-A</button>
                <button>A-Z</button>
            </div>
        </div>

        <div class="filterbar">
            Filter

            <span>Category</span>

            <div class="checkboxes">
                <div>
                    Category1
                    <input type="checkbox" id="category1">
                </div>

                <div>
                    Category2
                    <input type="checkbox" id="category2">
                </div>

                <div>
                    Category3
                    <input type="checkbox" id="category3">
                </div>
            </div>

            
                    <details class="filter-tab"> <!-- Renamed filterbar to filter-tab because i need to figure out how to up checkboxes inside checkboxes for the next section-->
                                <summary>Gender</summary>
                        <div class="filter-content">
                            <label class="filter-label"><input type="radio" class="filter" data-group="gender" value="Men's"> Men's</label>
                            <label class="filter-label"><input type="radio" class="filter" data-group="gender" value="Women's"> Women's</label>
                            <label class="filter-label"><input type="radio" class="filter" data-group="gender" value="Unisex"> Unisex</label>
                        </div>
                    </details>

                    <details class="filter-tab">
                        <summary>Color</summary>
                        <div class="filter-content">
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="color" value="Black"> Black</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="color" value="White"> White</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="color" value="Red"> Red</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="color" value="Blue"> Blue</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="color" value="Green"> Green</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="color" value="Brown"> Brown</label>
                        </div>
                    </details>

                    <details class="filter-tab">
                        <summary>Style</summary>
                        <div class="filter-content">
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="style" value="Casual"> Casual</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="style" value="Formal"> Formal</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="style" value="Streetwear"> Streetwear</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="style" value="Vintage"> Vintage</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="style" value="Minimalist"> Minimalist</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="style" value="Luxury"> Luxury</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="style" value="Outdoor"> Outdoor</label>
                        </div>
                    </details>

                    <details class="filter-tab">
                        <summary>Event</summary>
                        <div class="filter-content">
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="event" value="Christmas"> Christmas</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="event" value="Back-to-School"> Back-to-School</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="event" value="Halloween"> Halloween</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="event" value="Out-Doors"> Out-Doors</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="event" value="Sport"> Sport</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="event" value="Beach"> Beach</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="event" value="Easter"> Easter</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="event" value="Casual"> Casual</label>
                            <label class="filter-label"><input type="checkbox" class="filter" data-group="event" value="Formal"> Formal</label>
                        </div>
                    </details>

                    <details class="filter-tab">
                        <summary>Accessory Type</summary>
                         <div class="filter-content">

                        </div>
        </div>

    </div>


    
    <div class="rightside">

        <div class="imageandlogo">
            Image and Logo
        </div>

        <div class="main-content">
            Main Content
        </div>

    </div>

</div>



            



<script>

const itemsContainer = document.querySelector(".items");
const items = Array.from(document.querySelectorAll(".item"));



document.getElementById("sortaz").addEventListener("click", function() {

    items.sort(function(a, b) {

        let nameA = a.querySelector("p").textContent;
        let nameB = b.querySelector("p").textContent;

        return nameA.localeCompare(nameB);

    });

    items.forEach(function(item) {
        itemsContainer.appendChild(item);
    });

});



document.getElementById("selectza").addEventListener("click", function() {

    items.sort(function(a, b) {

        let nameA = a.querySelector("p").textContent;
        let nameB = b.querySelector("p").textContent;

        return nameB.localeCompare(nameA);

    });

    items.forEach(function(item) {
        itemsContainer.appendChild(item);
    });

});



document.getElementById("sortLow").onclick = function() {

    items.sort(function(a, b) {

        let priceA = parseFloat(
            a.querySelectorAll("p")[4].textContent.replace("$", "")
        );

        let priceB = parseFloat(
            b.querySelectorAll("p")[4].textContent.replace("$", "")
        );

        return priceA - priceB;
    });

    items.forEach(function(item) {
        itemsContainer.appendChild(item);
    });

};



document.getElementById("sortHigh").onclick = function() {

    items.sort(function(a, b) {

        let priceA = parseFloat(
            a.querySelectorAll("p")[4].textContent.replace("$", "")
        );

        let priceB = parseFloat(
            b.querySelectorAll("p")[4].textContent.replace("$", "")
        );

        return priceB - priceA;
    });

    items.forEach(function(item) {
        itemsContainer.appendChild(item);
    });

};

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season4Fashion</title>
</head>
<style>
    body{
        display: flex;
        flex-direction: column;
        background-color: #ffffff;

    }
    .header {
        height: 70px;
        background-color: #C3DFe3;
        border: 1px solid #000000;

        display: flex;  
        align-items: center;
        justify-content: center;

        font-size: 14px;
        margin: 0;



    }

    .filterbar {
        background-color: #C3DFe3;  
        height: 400px;
        
    }   

    .sidebar {
        background-color: #C3DFe3;
        grid-row: 1 / 3;
        height:300px
    }

    .sidebar h3{
        margin: 0 0 10px 0;
    }

    .sidebar button {
        
        width: 82px;
        height: 30px;
        font-size: 12px;
    }

    .main-content {
        background-color: #C3DFe3;
        display: grid;
        gap: 10px;
        grid-template-columns: 120px 1fr;
        grid-template-rows: 155px auto;
    }




    .content{
        border: 4px solid #d47024;
        width: 20%;
        height: 100%;
    }
    /* Add your CSS styles here*/
</style>
<body>
    <div class="header">Info Bar</div>
    <br>

    <div class="content">
    <div class="sidebar">Side Bar
        <h3> <i>Sort by</i></h3>
        
        <button>Lowest Price</button>
    
        <button>Highest Price</button>
        
        <button>Popularity</button>
        
        <button>Z-A</button>
        <button>A-Z</button>
    </div>
    <br>
    <div class="filterbar">Filter</div>
    </div>
    <br>
    <br>

    <div class="main-content">Main Content</div>


    <script>
        // Add your JavaScript code here
    </script>
</body>
</html>

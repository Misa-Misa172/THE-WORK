<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season4Fashion</title>
</head>
<style>
    body{
        display: flex;
        flex-direction: column;
        background-color: #ffffff;

    }
    .header {
        height: 70px;
        background-color: #C3DFe3;
        border: 1px solid #000000;

        display: flex;  
        align-items: center;
        justify-content: center;

        font-size: 14px;
        margin: 0;



    }
    .topsection{
        display: grid;
         grid-template-columns: 200px 1fr ;
         gap: 20px;
         width:100%;

    }

    .content{
        border: 2px solid #d47024;
        width: 200px;
        
    }

    .sidebar {
        background-color: #C3DFe3;
        height:300px;
        border: 1px solid #000000;
    }

    .filterbar {
        background-color: #C3DFe3;  
        height: 400px;
        
    } 

     .button {
        width: 82px;
        height: 30px;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        
        gap: 5px;
    }

     .checkboxes{
        display: flex;
        flex-direction: column;

    }

     .imageandlogo{
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid yellow;
        height: 200px;
        
        
    }

    .rightside{
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .main-content{
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid green;
        height: 500px;
    }
</style>
<body>
    <div class="header">Info Bar</div>
    <br>
<div class="topsection">

    <!-- LEFT SIDE -->
    <div class="content">

        <div class="sidebar">
            Side Bar

            <h3 style="font-size: 10px;">
                <i>Sort by</i>
            </h3>

            <div class="button">
                <button>Lowest Price</button>
                <button>Highest Price</button>
                <button>Popularity</button>
                <button>Z-A</button>
                <button>A-Z</button>
            </div>
        </div>

        <div class="filterbar">
            Filter

            <span>Category</span>

            <div class="checkboxes">
                <div>
                    Category1
                    <input type="checkbox" id="category1">
                </div>

                <div>
                    Category2
                    <input type="checkbox" id="category2">
                </div>

                <div>
                    Category3
                    <input type="checkbox" id="category3">
                </div>
            </div>
        </div>

    </div>


    <!-- RIGHT SIDE -->
    <div class="rightside">

        <div class="imageandlogo">
            Image and Logo
        </div>

        <div class="main-content">
            Main Content
        </div>

    </div>

</div>


<script>

const itemsContainer = document.querySelector(".items");
const items = Array.from(document.querySelectorAll(".item"));



document.getElementById("sortaz").addEventListener("click", function() {

    items.sort(function(a, b) {

        let nameA = a.querySelector("p").textContent;
        let nameB = b.querySelector("p").textContent;

        return nameA.localeCompare(nameB);

    });

    items.forEach(function(item) {
        itemsContainer.appendChild(item);
    });

});



document.getElementById("selectza").addEventListener("click", function() {

    items.sort(function(a, b) {

        let nameA = a.querySelector("p").textContent;
        let nameB = b.querySelector("p").textContent;

        return nameB.localeCompare(nameA);

    });

    items.forEach(function(item) {
        itemsContainer.appendChild(item);
    });

});



document.getElementById("sortLow").onclick = function() {

    items.sort(function(a, b) {

        let priceA = parseFloat(
            a.querySelectorAll("p")[4].textContent.replace("$", "")
        );

        let priceB = parseFloat(
            b.querySelectorAll("p")[4].textContent.replace("$", "")
        );

        return priceA - priceB;
    });

    items.forEach(function(item) {
        itemsContainer.appendChild(item);
    });

};



document.getElementById("sortHigh").onclick = function() {

    items.sort(function(a, b) {

        let priceA = parseFloat(
            a.querySelectorAll("p")[4].textContent.replace("$", "")
        );

        let priceB = parseFloat(
            b.querySelectorAll("p")[4].textContent.replace("$", "")
        );

        return priceB - priceA;
    });

    items.forEach(function(item) {
        itemsContainer.appendChild(item);
    });

};

</script>
</body>
</html>

<style>
    body{
        display: flex;
        flex-direction: column;
        background-color: #ffffff;

    }
   .header {
    height: 70px;
    background-color: #FFF8E7;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    font-size: 40px;
    margin: 0;
    gap: 20px;
    position: relative;
}

    .Ab {
    display: flex;
    align-items: center;
    font-size: 20px;
    gap: 10px;

    position: absolute;
    right: 20px;
}

    .topsection{
        display: grid;
         grid-template-columns: 200px 1fr ;
         gap: 20px;
         width:100%;

    }

    .content{
       border-radius: 15px;
        width: 200px;
        
    }

    .sidebar {
        background-color: #A8B89A;
        height:300px;
        border-bottom: 1px solid #000000;
        border-radius: 5px;
    }

    .filterbar {
        background-color: #A8B89A;  
        height: 620px;
        border-radius: 5px;
        
    } 

     .button {
        width: 82px;
        height: 30px;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        
        gap: 5px;
    }

    .button button{
        background-color: #D8C3A5;
    }

     .checkboxes{
        display: flex;
        flex-direction: column;
        gap: 4px;

    }

     .imageandlogo{
        display: flex;
        align-items: center;
        justify-content: center;
        
        height: 200px;
        border-radius: 5px;
        font-size: 100px;
        
        
    }

    .rightside{
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .main-content{
       
        height: 700px;
        background-image: url(images/mc-all.jpg);
        background-size:cover;
        display: flex;
        justify-content: center;
        border-radius: 10px;
        
    }

    .inside{
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 20px;
        
    }

    .descrip{
        display: grid;
        grid-template-columns: repeat(2, 65px);
        grid-template-rows: repeat(2, 35px);
    }

   


    .filter-content{
        display: flex;
        flex-direction: column;

    }

    .ilallyear{

      background-image:url(images/il-all.jpg);
    }

    }

    .ilspring{

    }

    .ilautumn{
